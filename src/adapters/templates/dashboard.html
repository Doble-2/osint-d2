<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>OSINT-D2 // Live Intelligence Dashboard</title>
  
  <!-- Tailwind CSS & Vis.js (Zero Node.js build steps) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cyber: { bg: '#070a10', card: '#0f172a', border: '#1e293b', accent: '#00f0ff', red: '#ff0055', green: '#00ff88', yellow: '#ffd000' }
          }
        }
      }
    }
  </script>

  <!-- El sistema de diseno de marca se inyecta desde adapters/report_theme.py -->
</head>
<body class="h-full text-slate-200 flex flex-col font-sans overflow-hidden lg:overflow-hidden">

  <!-- TOPBAR HEADER -->
  <header class="min-h-14 border-b border-cyber-border bg-cyber-card/90 backdrop-blur px-3 lg:px-6 py-2 flex items-center justify-between gap-2 z-20 flex-wrap">
    <div class="flex items-center space-x-3">
      <div class="w-9 h-9 rounded-lg bg-[rgba(15,118,110,0.20)] border border-[rgba(52,211,153,0.45)] flex items-center justify-center text-[#34d399] font-black tracking-[0.15em] text-sm shadow-[0_0_14px_rgba(52,211,153,0.25)]">
        D2
      </div>
      <div>
        <h1 class="text-sm font-extrabold tracking-[0.18em] text-white uppercase">OSINT-D2</h1>
        <p class="text-[11px] text-slate-400 hidden sm:block tracking-[0.10em] uppercase">Informe de Inteligencia de Identidad</p>
      </div>
    </div>

    <!-- Controles de Descarga y Estado -->
    <div class="flex items-center space-x-3">
      <span id="badge-status" class="px-2.5 py-1 rounded-full text-[11px] font-semibold bg-[rgba(16,185,129,0.12)] text-[#34d399] border border-[rgba(52,211,153,0.30)] flex items-center gap-1.5 uppercase tracking-[0.08em]">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> LISTO
      </span>
      <button id="btn-cancel" onclick="cancelInvestigation()" class="hidden px-3 py-1.5 rounded-lg bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/30 text-[11px] font-semibold transition min-h-[44px] text-center items-center">
        <i class="fa-solid fa-stop"></i> <span class="hidden sm:inline">Cancelar</span>
      </button>
      <button id="btn-download-pdf" onclick="downloadArtefact('pdf')" class="hidden px-3 min-h-[44px] rounded-lg bg-cyber-accent/10 hover:bg-cyber-accent/20 border border-cyber-accent/40 text-cyber-accent text-xs font-semibold transition flex items-center gap-2">
        <i class="fa-solid fa-file-pdf"></i> Descargar PDF
      </button>
      <button id="btn-download-canvas" onclick="downloadArtefact('canvas')" class="hidden px-3 min-h-[44px] rounded-lg bg-white/5 hover:bg-white/10 border border-white/15 text-slate-300 text-xs font-semibold transition flex items-center gap-2">
        <i class="fa-solid fa-diagram-project"></i> <span class="hidden sm:inline">Obsidian Canvas</span><span class="sm:hidden">Canvas</span>
      </button>
    </div>
  </header>

  <!-- MAIN WORKSPACE -->
  <div class="flex-1 flex flex-col lg:flex-row overflow-hidden">
    
    <!-- PANEL IZQUIERDO: CONFIGURACIÓN MULTI-VECTOR -->
    <aside id="control-panel" class="w-full lg:w-[450px] lg:shrink-0 border-b lg:border-b-0 lg:border-r border-cyber-border bg-cyber-card/75 backdrop-blur flex flex-col z-10 overflow-y-auto lg:overflow-hidden">
      
      <div class="p-3 lg:p-4 border-b border-cyber-border">
        <button onclick="toggleForm()" class="w-full min-h-[44px] flex items-center justify-between lg:pointer-events-none lg:cursor-default" aria-label="Mostrar u ocultar el formulario de vectores" aria-expanded="true">
          <span class="text-xs font-bold text-cyber-accent uppercase tracking-wider flex items-center gap-1.5">
            <i class="fa-solid fa-sliders"></i> Matriz de Vectores OSINT
          </span>
          <span class="flex items-center gap-2">
            <span class="text-[11px] text-slate-400 hidden sm:inline">Multi-Target Input</span>
            <i id="form-chevron" class="fa-solid fa-chevron-down lg:hidden text-slate-400 text-xs transition-transform"></i>
          </span>
        </button>
      </div>
      <div id="vector-form" class="p-3 lg:p-4 space-y-3 border-b border-cyber-border hidden lg:block">

        <!-- Target Principal -->
        <div>
          <label class="block text-[11px] font-semibold text-slate-300 mb-1">Nombre o Sujeto Principal *</label>
          <input type="text" id="target-input" value="Ángel Calderón Rodríguez" 
                 class="w-full bg-[var(--surface-inset)] border border-cyber-border focus:border-cyber-accent rounded-lg px-3 min-h-[44px] text-xs text-white outline-none font-mono">
        </div>

        <!-- Usernames / Handles -->
        <div>
          <label class="block text-[11px] font-semibold text-slate-300 mb-1">Usernames / Handles (separados por coma)</label>
          <input type="text" id="usernames-input" value="Doble-2, angelcaldev, DobleVneko" 
                 class="w-full bg-[var(--surface-inset)] border border-cyber-border focus:border-cyber-accent rounded-lg px-3 min-h-[44px] text-xs text-white outline-none font-mono">
        </div>

        <!-- Correos Electrónicos -->
        <div>
          <label class="block text-[11px] font-semibold text-slate-300 mb-1">Correos Electrónicos (personal / trabajo)</label>
          <input type="text" id="emails-input" value="angel@angelcalderon.dev, acalderon@fospuca.com" 
                 class="w-full bg-[var(--surface-inset)] border border-cyber-border focus:border-cyber-accent rounded-lg px-3 min-h-[44px] text-xs text-white outline-none font-mono">
        </div>

        <!-- Números de Teléfono -->
        <div>
          <label class="block text-[11px] font-semibold text-slate-300 mb-1">Números Telefónicos (E.164 o local)</label>
          <input type="text" id="phones-input" value="+584241922882" 
                 class="w-full bg-[var(--surface-inset)] border border-cyber-border focus:border-cyber-accent rounded-lg px-3 min-h-[44px] text-xs text-white outline-none font-mono">
        </div>

        <!-- Anclas de Confianza (Trust Anchors) -->
        <div>
          <label class="block text-[11px] font-semibold text-cyber-orange mb-1 flex items-center gap-1">
            <i class="fa-solid fa-anchor"></i> Anclas de Confianza Verificadas (Trust Anchors)
          </label>
          <input type="text" id="anchors-input" value="github:Doble-2, web:https://angelcalderon.dev" 
                 placeholder="e.g. github:Doble-2, twitter:angelcaldev"
                 class="w-full bg-[var(--surface-inset)] border border-[rgba(245,158,11,0.35)] rounded-lg px-3 min-h-[44px] text-xs text-white outline-none font-mono">
          <p class="text-[11px] text-slate-400 mt-0.5">Las fuentes de verdad incuestionables para evitar homónimos y falsos amigos.</p>
        </div>

        <!-- Opciones del Motor -->
        <div class="grid grid-cols-2 gap-2 pt-1">
          <div>
            <label class="block text-[11px] text-slate-400 mb-1">Modo de Búsqueda</label>
            <select id="mode-select" class="w-full bg-[var(--surface-inset)] border border-cyber-border rounded-lg px-2.5 min-h-[44px] text-xs text-slate-200 outline-none">
              <option value="agent">Agente Autónomo IA</option>
              <option value="phone">Sólo Telecom / Teléfono</option>
            </select>
          </div>
          <div>
            <label class="block text-[11px] text-slate-400 mb-1">Proveedor IA</label>
            <select id="ai-provider-select" class="w-full bg-[var(--surface-inset)] border border-cyber-border rounded-lg px-2.5 min-h-[44px] text-xs text-slate-200 outline-none">
              <option value="deepseek">DeepSeek API</option>
              <option value="ollama">Ollama Local (Offline)</option>
              <option value="openai">OpenAI</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-[11px] text-slate-400 mb-1">Idioma de Salida</label>
            <select id="lang-select" class="w-full bg-[var(--surface-inset)] border border-cyber-border rounded-lg px-2.5 min-h-[44px] text-xs text-slate-200 outline-none">
              <option value="es">Español</option>
              <option value="en">English</option>
              <option value="pt">Português</option>
            </select>
          </div>
          <div>
            <label class="block text-[11px] text-slate-400 mb-1">Pasos Máximos</label>
            <input type="number" id="max-steps-input" value="6" min="3" max="15" 
                   class="w-full bg-[var(--surface-inset)] border border-cyber-border rounded-lg px-2.5 min-h-[44px] text-xs text-slate-200 outline-none">
          </div>
        </div>

        <!-- Botón de Lanzamiento -->
        <button id="btn-start" onclick="launchInvestigation()" 
                class="w-full min-h-[44px] rounded-lg bg-cyber-accent text-[#070a10] font-black text-xs tracking-wider uppercase hover:shadow-[0_0_24px_rgba(0,240,255,0.4)] hover:brightness-110 transition flex items-center justify-center gap-2">
          <i class="fa-solid fa-radar"></i> Ejecutar Investigación Multi-Vector
        </button>
      </div>

      <!-- Live Terminal Console -->
      <div class="flex-1 flex flex-col p-4 overflow-hidden">
        <div class="flex items-center justify-between mb-2">
          <span class="text-[11px] font-bold text-slate-400 uppercase tracking-wider flex items-center gap-1.5">
            <i class="fa-solid fa-terminal text-cyber-accent"></i> Razonamiento del Agente
          </span>
          <span id="step-counter" class="text-[11px] text-slate-400 font-mono">Paso 0/5</span>
        </div>
        <div id="terminal-logs" class="flex-1 bg-[var(--surface-inset)] border border-cyber-border rounded-lg p-3 overflow-y-auto font-mono text-[11px] space-y-1.5 text-slate-300 leading-relaxed">
          <div class="text-slate-400">&gt; Sistema listo. Ingrese un objetivo para iniciar el enjambre...</div>
        </div>
      </div>
    </aside>

    <!-- PANEL DERECHO: GRAFO VISUAL EN VIVO & DOSSIER -->
    <main class="flex-1 flex flex-col relative bg-[var(--surface-inset)] min-h-[50vh] lg:min-h-0">

      <!-- PANEL PRINCIPAL: GRAFO MULTI-VECTOR (SVG nativo) -->
      <div id="graph-svg-container" class="w-full flex-1 overflow-auto p-2 lg:p-6 hidden">
        <div id="graph-svg-holder" class="inline-block min-w-full"></div>
      </div>

      <!-- PANEL ALTERNATIVO: HILO DE INVESTIGACIÓN (timeline) -->
      <div id="timeline-container" class="w-full h-full overflow-y-auto p-6 hidden">
        <div id="timeline-steps" class="space-y-0"></div>
      </div>

      <!-- Contenedor del Grafo Interactivo -->
      <div id="graph-container" class="w-full h-full relative">
        <div class="absolute top-4 left-4 z-10 bg-cyber-card/80 border border-cyber-border backdrop-blur px-3 py-1.5 rounded-lg text-xs font-mono text-slate-400 pointer-events-none">
          NODOS: <span id="node-count" class="text-cyber-accent font-bold">0</span> &bull; CONEXIONES: <span id="edge-count" class="text-cyber-accent font-bold">0</span>
        </div>
      </div>

      <!-- Modal / Panel Inferior de Reporte Final -->
      <div id="report-drawer" class="absolute bottom-0 left-0 right-0 max-h-[60%] lg:max-h-[45%] bg-cyber-card/95 border-t border-cyber-border backdrop-blur-xl p-3 lg:p-5 overflow-y-auto transform translate-y-full transition-transform duration-300 z-20 shadow-2xl">
        <div class="flex items-center justify-between border-b border-cyber-border pb-3 mb-3">
          <div class="flex items-center gap-2">
            <span class="text-xs font-bold text-cyber-accent uppercase tracking-wider">Dossier Ejecutivo Final</span>
            <span id="report-confidence" class="px-2 py-0.5 rounded text-[11px] font-bold bg-cyber-accent/10 text-cyber-accent border border-cyber-accent/30">87% Confianza</span>
          </div>
          <button onclick="toggleReportDrawer()" aria-label="Cerrar el informe" class="text-slate-400 hover:text-white text-sm min-w-[44px] min-h-[44px] flex items-center justify-center rounded-lg hover:bg-white/5 transition"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div id="report-highlights" class="space-y-1.5 text-xs text-slate-300 mb-4 font-sans"></div>
        <div id="report-summary" class="text-xs text-slate-400 whitespace-pre-wrap font-mono leading-relaxed bg-[var(--surface-inset)] p-3 rounded-lg border border-cyber-border"></div>
      </div>

    </main>
  </div>

  <!-- LÓGICA JAVASCRIPT REACTIVA -->
  <script>
    let network = null;
    let nodes = new vis.DataSet([]);
    let edges = new vis.DataSet([]);
    let currentInvId = null;
    let ws = null;

    // Inicializar Vis.js Network
    function initNetwork() {
      const container = document.getElementById('graph-container');
      const data = { nodes: nodes, edges: edges };
      const options = {
        groups: {
          /* Paleta de marca: misma familia cromatica del informe PDF */
          target:    { color: { background: '#0d9488', border: '#34d399' }, font: { color: '#f0fdf4', size: 13, bold: true }, shadow: { color: 'rgba(52,211,153,0.45)', size: 14 } },
          identity:  { color: { background: '#0f766e', border: '#34d399' },  font: { color: '#f0fdf4', size: 12, bold: true } },
          phone:     { color: { background: '#10b981', border: '#34d399' },  font: { color: '#04120e', size: 12, bold: true } },
          email:     { color: { background: '#0a231d', border: '#0d9488' },  font: { color: '#e8f5f0', size: 11 } },
          platform:  { color: { background: '#0a231d', border: '#5a7d6e' },  font: { color: '#a8c5bb', size: 11 } },
          social:    { color: { background: '#0a231d', border: '#5a7d6e' },  font: { color: '#a8c5bb', size: 11 } },
          colleague: { color: { background: '#0e2c24', border: '#7a9d92' },  font: { color: '#a8c5bb', size: 11 } },
          noise:     { color: { background: 'rgba(90,125,110,0.15)', border: 'rgba(90,125,110,0.35)' }, font: { color: '#7a9d92', size: 10 } },
          risk:      { color: { background: '#7f1d1d', border: '#ef4444' },  font: { color: '#fecaca', size: 11, bold: true } }
        },
        nodes: { shape: 'box', margin: 10, borderWidth: 1.5, shapeProperties: { borderRadius: 8 } },
        edges: { font: { color: '#7a9d92', size: 9, align: 'top', background: 'rgba(4,18,14,0.9)' }, arrows: { to: { scaleFactor: 0.7 } }, color: { color: 'rgba(52,211,153,0.28)', highlight: '#34d399' }, smooth: { type: 'continuous' } },
        physics: { forceAtlas2Based: { gravitationalConstant: -90, centralGravity: 0.015, springLength: 140 } },
        interaction: { hover: true, zoomView: true, dragView: true }
      };
      network = new vis.Network(container, data, options);
      network.once('stabilizationIterationsDone', function() {
        network.fit({ animation: { duration: 800, easingFunction: 'easeInOutQuad' } });
      });
    }

    async function launchInvestigation() {
      const target = document.getElementById('target-input').value.trim();
      const usernames = document.getElementById('usernames-input').value.split(',').map(s => s.trim()).filter(Boolean);
      const emails = document.getElementById('emails-input').value.split(',').map(s => s.trim()).filter(Boolean);
      const phones = document.getElementById('phones-input').value.split(',').map(s => s.trim()).filter(Boolean);
      const anchors = document.getElementById('anchors-input').value.split(',').map(s => s.trim()).filter(Boolean);
      const mode = document.getElementById('mode-select').value;
      const aiProvider = document.getElementById('ai-provider-select').value;
      const lang = document.getElementById('lang-select').value;
      const maxSteps = parseInt(document.getElementById('max-steps-input').value) || 6;

      if (!target) return;

      // Reset UI
      nodes.clear();
      edges.clear();
      document.getElementById('terminal-logs').innerHTML = '';
      document.getElementById('btn-download-pdf').classList.add('hidden');
      document.getElementById('btn-download-canvas').classList.add('hidden');
      document.getElementById('report-drawer').classList.add('translate-y-full');
      document.getElementById('timeline-steps').innerHTML = '';
      document.getElementById('graph-svg-holder').innerHTML = '';
      document.getElementById('timeline-container').classList.add('hidden');
      document.getElementById('graph-svg-container').classList.add('hidden');
      document.getElementById('graph-container').classList.remove('hidden');
      document.getElementById('badge-status').innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-cyber-accent animate-ping"></span> INVESTIGANDO';

      collapseFormOnMobile();

      try {
        const resp = await fetch('/api/investigate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            target: target,
            usernames: usernames,
            emails: emails,
            phones: phones,
            trust_anchors: anchors,
            mode: mode,
            ai_provider: aiProvider,
            language: lang,
            max_steps: maxSteps
          })
        });
        const data = await resp.json();
        currentInvId = data.investigation_id;
        const cancelBtn = document.getElementById('btn-cancel');
        if (cancelBtn) cancelBtn.classList.remove('hidden');

        // Conectar WebSocket
        connectWebSocket(currentInvId);
      } catch (err) {
        logToTerminal(`[ERROR] Falló conexión con API: ${err}`);
      }
    }

    function connectWebSocket(invId) {
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(`${protocol}//${window.location.host}/ws/${invId}`);

      ws.onmessage = (event) => {
        const msg = JSON.parse(event.data);
        if (msg.type === 'log') {
          logToTerminal(msg.data);
        } else if (msg.type === 'graph_svg') {
          const holder = document.getElementById('graph-svg-holder');
          if (holder && msg.data.svg) {
            holder.innerHTML = msg.data.svg;
            const svgEl = holder.querySelector('svg');
            if (svgEl) {
              svgEl.style.maxWidth = '100%';
              svgEl.style.height = 'auto';
              svgEl.style.display = 'block';
            }
            const cont = document.getElementById('graph-svg-container');
            if (cont) {
              // En mobile el grafo es más alto que ancho: permitir zoom horizontal
              cont.style.overflowX = 'auto';
              cont.style.overflowY = 'auto';
            }
            showGraphSvg();
          }
          logToTerminal('[GRAFO] ' + msg.data.nodes + ' entidades, ' +
                        msg.data.edges + ' relaciones, ' + msg.data.vectors + ' vectores.');
        } else if (msg.type === 'timeline') {
          renderTimeline(msg.data);
          showTimeline();
        } else if (msg.type === 'graph_reset') {
          nodes.clear();
          edges.clear();
          updateCounters();
          logToTerminal('[GRAFO] Reconstruyendo el hilo de la investigación...');
        } else if (msg.type === 'node_add') {
          if (!nodes.get(msg.data.id)) {
            nodes.add(msg.data);
            updateCounters();
            if (network) {
              network.fit({ animation: { duration: 400, easingFunction: 'easeInOutQuad' } });
            }
          }
        } else if (msg.type === 'edge_add') {
          edges.add(msg.data);
          updateCounters();
          if (network) {
            network.fit({ animation: { duration: 400, easingFunction: 'easeInOutQuad' } });
          }
        } else if (msg.type === 'phone_data') {
          logToTerminal(`[TELECOM DETECTED] Carrier: ${msg.data.carrier} | País: ${msg.data.country} | WhatsApp: ${msg.data.whatsapp ? 'SÍ' : 'NO'}`);
        } else if (msg.type === 'report_done') {
          showReport(msg.data);
        } else if (msg.type === 'status' && msg.data === 'completed') {
          document.getElementById('badge-status').innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-amber-400"></span> CANCELADO';
          const cb2 = document.getElementById('btn-cancel');
          if (cb2) cb2.classList.add('hidden');
          currentInvId = null;
          logToTerminal('[CANCEL] Investigación cancelada por el usuario.', 'warn');
        } else if (msg.type === 'status' && msg.data === 'cancelled') {
          document.getElementById('badge-status').innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-amber-400"></span> CANCELADO';
          const cb3 = document.getElementById('btn-cancel');
          if (cb3) cb3.classList.add('hidden');
          currentInvId = null;
          document.getElementById('btn-download-pdf').classList.remove('hidden');
          document.getElementById('btn-download-canvas').classList.remove('hidden');
        }
      };
    }

    const KIND_STYLE = {
      Target:    ['#ff0055', 'PUNTO DE PARTIDA'],
      Platform:  ['#00f0ff', 'PERFIL'],
      Domain:    ['#00f0ff', 'SITIO WEB'],
      Phone:     ['#00ff88', 'TELÉFONO'],
      Email:     ['#ffd000', 'CORREO'],
      Identity:  ['#ffaa00', 'IDENTIDAD'],
      Finding:   ['#38bdf8', 'CONCLUSIÓN'],
      Colleague: ['#bd00ff', 'TERCERO'],
      Breach:    ['#ef4444', 'EXPOSICIÓN'],
      Noise:     ['#475569', 'DESCARTADO'],
    };

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function extractFacts(text) {
      if (!text) return [];
      const out = [];
      const push = v => { if (v && !out.map(x=>x.toLowerCase()).includes(v.toLowerCase())) out.push(v); };
      (text.match(/\+?\d[\d\s\-()]{7,}\d/g) || []).forEach(m => { if (m.replace(/\D/g,'').length >= 8) push('tel ' + m.trim()); });
      (text.match(/[\w.+-]+@[\w-]+\.[\w.]+/g) || []).forEach(push);
      let m;
      if ((m = /followers[=:\s]+(\d+)/i.exec(text))) push(m[1] + ' seguidores');
      if ((m = /public_repos[=:\s]+(\d+)/i.exec(text))) push(m[1] + ' repos');
      (text.match(/([A-ZÁÉÍÓÚÑ][a-záéíóúñ]+(?:\s[A-ZÁÉÍÓÚÑ][a-záéíóúñ]+)?,\s[A-ZÁÉÍÓÚÑ][a-záéíóúñ]+)/g) || []).forEach(c => { if (c.length < 40) push(c); });
      return out.slice(0, 5);
    }

    function renderTimeline(data) {
      const wrap = document.getElementById('timeline-steps');
      wrap.innerHTML = '';
      const steps = data.steps || [];
      if (!steps.length) {
        wrap.innerHTML = '<div class="text-slate-400 text-xs">Sin pasos registrados.</div>';
        return;
      }

      if (data.confidence != null) {
        const c = document.createElement('div');
        c.className = 'mb-5 flex items-center gap-3';
        c.innerHTML = '<span class="text-[11px] tracking-widest text-slate-400">CONFIANZA GLOBAL</span>' +
                      '<span class="text-2xl font-bold text-cyber-green">' + Math.round(data.confidence * 100) + '%</span>';
        wrap.appendChild(c);
      }

      steps.forEach((s, i) => {
        const style = KIND_STYLE[s.kind] || ['#94a3b8', s.kind];
        const color = style[0], kind = style[1];
        const label = (s.label || '').split('\n')[0];
        const viaMatch = (s.label || '').match(/\[via ([a-z_]+)\]/);
        const facts = extractFacts(s.evidence || '');
        const corr = s.correlation != null ? Math.round(s.correlation * 100) + '%' : '';

        const el = document.createElement('div');
        el.className = 'flex gap-4';
        el.innerHTML =
          '<div class="w-4 flex flex-col items-center flex-shrink-0">' +
            '<div class="w-3 h-3 rounded-full border-2 mt-3" style="border-color:' + color + ';background:' + color + '22"></div>' +
            (i < steps.length - 1 ? '<div class="w-0.5 flex-1 bg-slate-800"></div>' : '') +
          '</div>' +
          '<div class="flex-1 pb-5">' +
            '<div class="flex items-center gap-2 flex-wrap mb-1.5">' +
              '<span class="text-[11px] font-extrabold tracking-wider px-1.5 py-0.5 rounded border" style="color:' + color + ';border-color:' + color + '55">' + esc(kind) + '</span>' +
              '<span class="text-[11px] text-slate-600 font-mono">#' + i + '</span>' +
              (viaMatch ? '<span class="text-[11px] text-slate-400 font-mono bg-slate-900 px-1.5 py-0.5 rounded">via ' + esc(viaMatch[1]) + '</span>' : '') +
              (corr ? '<span class="text-[11px] font-bold text-cyber-green ml-auto">' + corr + '</span>' : '') +
            '</div>' +
            '<div class="text-[13px] text-slate-100 leading-snug font-medium">' + esc(label) + '</div>' +
            (facts.length ? '<div class="flex flex-wrap gap-1.5 mt-2">' + facts.map(f => '<span class="text-[11px] bg-slate-900 border border-slate-800 text-blue-300 px-2 py-0.5 rounded-full">' + esc(f) + '</span>').join('') + '</div>' : '') +
            (s.evidence && !facts.length ? '<div class="text-[11px] text-slate-400 mt-2 font-mono border-l-2 border-slate-800 pl-2.5 leading-relaxed">' + esc(String(s.evidence).slice(0, 280)) + '</div>' : '') +
          '</div>';
        wrap.appendChild(el);
      });
    }

    async function cancelInvestigation() {
      if (!currentInvId) return;
      logToTerminal('[CANCEL] Solicitando detencion de la investigacion...', 'warn');
      try {
        await fetch(`/api/cancel/${currentInvId}`, { method: 'POST' });
      } catch (e) {
        logToTerminal('[ERROR] No se pudo cancelar: ' + e.message, 'err');
      }
    }

    function toggleForm() {
      const form = document.getElementById('vector-form');
      const chev = document.getElementById('form-chevron');
      if (!form) return;
      const isHidden = form.classList.contains('hidden');
      form.classList.toggle('hidden', !isHidden);
      if (chev) chev.style.transform = isHidden ? 'rotate(180deg)' : 'rotate(0deg)';
    }

    function collapseFormOnMobile() {
      // En móvil, cerrar el formulario al lanzar para dar espacio al grafo
      if (window.innerWidth < 1024) {
        const form = document.getElementById('vector-form');
        const chev = document.getElementById('form-chevron');
        if (form) form.classList.add('hidden');
        if (chev) chev.style.transform = 'rotate(0deg)';
      }
    }

    function showGraphSvg() {
      document.getElementById('graph-svg-container').classList.remove('hidden');
      document.getElementById('timeline-container').classList.add('hidden');
      document.getElementById('graph-container').classList.add('hidden');
    }

    function showTimeline() {
      document.getElementById('timeline-container').classList.remove('hidden');
      document.getElementById('graph-container').classList.add('hidden');
    }

    function toggleView() {
      const sv = document.getElementById('graph-svg-container');
      const tl = document.getElementById('timeline-container');
      const gr = document.getElementById('graph-container');
      const svVisible = !sv.classList.contains('hidden');
      if (svVisible) {
        // grafo SVG -> red interactiva
        sv.classList.add('hidden');
        gr.classList.remove('hidden');
        if (network) setTimeout(() => network.fit({ animation: { duration: 400 } }), 120);
      } else {
        sv.classList.remove('hidden');
        gr.classList.add('hidden');
        tl.classList.add('hidden');
      }
    }

    function logToTerminal(text) {
      const logs = document.getElementById('terminal-logs');
      const row = document.createElement('div');
      if (text.includes('[PASO')) row.className = 'text-cyber-accent font-semibold';
      else if (text.includes('[ERROR]')) row.className = 'text-red-400';
      else row.className = 'text-slate-300';
      row.innerText = text;
      logs.appendChild(row);
      logs.scrollTop = logs.scrollHeight;
    }

    function updateCounters() {
      const nc = document.getElementById('node-count');
      const ec = document.getElementById('edge-count');
      if (nc) nc.innerText = nodes.length;
      if (ec) ec.innerText = edges.length;
    }

    function showReport(rep) {
      const confEl = document.getElementById('report-confidence');
      if (confEl) confEl.innerText = `${Math.round(rep.confidence * 100)}% Confianza`;
      const highDiv = document.getElementById('report-highlights');
      if (!highDiv) return;
      highDiv.innerHTML = '';
      (rep.highlights || []).forEach(h => {
        const p = document.createElement('div');
        p.className = 'flex items-start gap-2';
        p.innerHTML = `<span class="text-cyber-accent">•</span><span>${h}</span>`;
        highDiv.appendChild(p);
      });
      document.getElementById('report-summary').innerText = rep.summary || '';
      document.getElementById('report-drawer').classList.remove('translate-y-full');
    }

    function toggleReportDrawer() {
      document.getElementById('report-drawer').classList.toggle('translate-y-full');
    }

    function downloadArtefact(type) {
      if (!currentInvId) return;
      window.open(`/api/download/${currentInvId}/${type}`, '_blank');
    }

    window.onload = initNetwork;
  </script>
</body>
</html>
