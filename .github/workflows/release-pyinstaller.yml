name: Release (PyInstaller)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linux deps (WeasyPrint)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 shared-mime-info

      - name: Install macOS deps (WeasyPrint)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install pango shared-mime-info

      # Windows note: WeasyPrint PDF may fail at runtime due to GTK/Cairo.
      # OSINT-D2 falls back to HTML if PDF export fails.

      - name: Install Poetry
        run: python -m pip install -U pip poetry

      - name: Install Python deps
        run: |
          poetry install --no-interaction
          poetry run pip install "pyinstaller>=6.6"

      - name: Build with PyInstaller
        run: |
          poetry run pyinstaller -y packaging/pyinstaller/osint-d2.spec

      - name: Smoke test (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          ./dist/osint-d2/osint-d2 --version
          ./dist/osint-d2/osint-d2 --help
          ./dist/osint-d2/osint-d2 doctor run

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PYTHONUTF8: 1
          PYTHONIOENCODING: utf-8
        run: |
          chcp 65001
          .\dist\osint-d2\osint-d2.exe --version
          .\dist\osint-d2\osint-d2.exe --help
          .\dist\osint-d2\osint-d2.exe doctor run

      - name: Archive artifact (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cd dist
          tar -czf "osint-d2-${{ runner.os }}.tar.gz" osint-d2

      - name: Archive artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist\osint-d2\* -DestinationPath "dist\osint-d2-Windows.zip" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: osint-d2-${{ runner.os }}
          path: |
            dist/osint-d2-${{ runner.os }}.tar.gz
            dist/osint-d2-Windows.zip

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Display artifacts
        run: |
          ls -R artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            artifacts/**/osint-d2-*.tar.gz
            artifacts/**/osint-d2-*.zip
          generate_release_notes: true
          body: |
            ## Before you run a binary

            **Scans work right away.** PDFs and graph images need extras:

            - **Dashboard PDFs and graph images:** Chromium
            - **CLI PDFs:** Pango. Without it, `--export-pdf` creates an HTML file

            See the [installation guide](https://osint-d2.angelcalderon.dev/getting-started/installation/#standalone-binaries).

            **These binaries aren't signed**, so your system may warn you or block them. Install with pipx or Docker to avoid that, or follow the steps in the guide.
