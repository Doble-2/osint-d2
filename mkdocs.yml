site_name: OSINT-D2
site_url: https://osint-d2.angelcalderon.dev
site_description: "Agentic OSINT platform — autonomous identity investigation, 6D cognitive profiling, breach analysis."
site_author: Doble-2
repo_url: https://github.com/Doble-2/osint-d2
repo_name: Doble-2/osint-d2
edit_uri: edit/main/docs/

copyright: "© 2024-2026 Doble-2 — MIT License"

theme:
  name: material
  custom_dir: docs/overrides
  palette:
    - scheme: slate
      primary: black
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.instant
    - navigation.instant.progress
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Doble-2/osint-d2

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - minify:
      minify_html: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.keys
  - pymdownx.mark

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Configuration: getting-started/configuration.md
    - Quick Start: getting-started/quickstart.md
  - Guides:
    - Web Dashboard: guides/web-dashboard.md
    - CLI Reference: guides/cli-reference.md
    - Agent Mode: guides/agent-mode.md
    - Docker Deployment: guides/docker.md
    - Languages: guides/languages.md
    - Security & Responsible Use: guides/security.md
  - API Reference:
    - REST Endpoints: api/endpoints.md
    - WebSocket Protocol: api/websocket.md
  - Architecture:
    - Overview: architecture/overview.md
    - Trust Anchor System: architecture/trust-anchors.md
  - Contributing:
    - Development Setup: contributing/development.md
    - Adding Scanners: contributing/adding-scanners.md
  - Changelog: changelog.md
