# OSINT-D2 — Docker Compose
# Quick start: cp .env.example .env && docker compose up -d
# Dashboard: http://localhost:8000

services:
  osint-d2:
    build: .
    # Uncomment to pull pre-built image from GHCR instead of building locally:
    # image: ghcr.io/doble-2/osint-d2:latest
    container_name: osint-d2
    ports:
      - "${OSINT_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./reports:/app/reports
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
