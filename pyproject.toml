[tool.poetry]
name = "osint-d2"
version = "3.0.0"
description = "Modern OSINT platform for identity investigation: AI-powered agent, web dashboard, and PDF dossier generation."
authors = ["Doble-2"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/Doble-2/osint-d2"
homepage = "https://osint-d2.angelcalderon.dev"
documentation = "https://osint-d2.angelcalderon.dev"
keywords = ["osint", "intelligence", "cli", "identity", "recon"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
]
include = [
  "src/adapters/templates/*.html",
  "src/adapters/templates/i18n/*.json",
  "src/adapters/templates/vendor/**/*",
]
packages = [
  { include = "core", from = "src" },
  { include = "adapters", from = "src" },
  { include = "cli", from = "src" },
]

[tool.poetry.dependencies]
python = "^3.11"
click = ">=8.1,<8.6"  # Click 8.2 breaks Typer 0.12 --help (Parameter.make_metavar)
typer = ">=0.12.3,<0.28.0"
rich = ">=13.7.1,<16.0.0"
httpx = ">=0.27.2,<0.29.0"
pydantic = "^2.10.4"
pydantic-settings = "^2.7.1"
openai = ">=1.59.9,<4.0.0"
jinja2 = "^3.1.5"
weasyprint = ">=70"
markupsafe = ">=2.1"
beautifulsoup4 = "^4.12.3"
markdown = "^3.6"
websockets = "^17.2"
playwright = "^1.64.0"
phonenumbers = ">=8.13,<10.0"
fastapi = ">=0.111"
uvicorn = {version = ">=0.29", extras = ["standard"]}
eval-type-backport = ">=0.2"
Pillow = ">=10.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0"
pytest-asyncio = "^1.0"
pytest-cov = ">=5"
ruff = ">=0.11,<0.18"

[tool.poetry.scripts]
osint-d2 = "cli.main:run"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "E402"]
