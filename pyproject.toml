[tool.poetry]
name = "osint-d2"
version = "3.0.0"
description = "Modern OSINT platform for identity investigation: AI-powered agent, web dashboard, and PDF dossier generation."
authors = ["Doble-2"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/Doble-2/osint-d2"
homepage = "https://doble-2.github.io/osint-d2"
documentation = "https://doble-2.github.io/osint-d2"
keywords = ["osint", "intelligence", "cli", "identity", "recon"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
include = [
  "src/adapters/templates/*.html",
  "src/adapters/templates/i18n/*.json",
  "src/adapters/templates/vendor/**/*",
]
packages = [
  { include = "core", from = "src" },
  { include = "adapters", from = "src" },
  { include = "cli", from = "src" },
]

[tool.poetry.dependencies]
python = "^3.11"
click = ">=8.1,<8.3"  # Click 8.3 breaks Typer boolean flag pairs
typer = "^0.12.3"
rich = "^13.7.1"
httpx = "^0.27.2"
pydantic = "^2.10.4"
pydantic-settings = "^2.7.1"
openai = "^1.59.9"
jinja2 = "^3.1.5"
# WeasyPrint pinned to 60.1 + pydyf <0.11 due to breaking API changes in
# newer versions that affect PDF rendering.  Revisit when upgrading.
weasyprint = "60.1"
pydyf = "<0.11"
beautifulsoup4 = "^4.12.3"
markdown = "^3.6"
websockets = "^17.2"
playwright = "^1.64.0"
phonenumbers = "^8.13"
fastapi = ">=0.111"
uvicorn = {version = ">=0.29", extras = ["standard"]}
eval-type-backport = ">=0.2"
Pillow = ">=10.0"

[tool.poetry.dependencies.tls-client]
version = "^1.0.1"
optional = true

[tool.poetry.extras]
tls = ["tls-client"]

[tool.poetry.group.dev.dependencies]
pytest = "^9.0"
pytest-asyncio = "^1.0"
ruff = "^0.11"

[tool.poetry.scripts]
osint-d2 = "cli.main:run"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "E402"]
